[project]
name = "solarwatch"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "httpx>=0.27",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=16",
  "lightgbm>=4.3",
  "joblib>=1.4",
  "apscheduler>=3.10,<4",
  "pyyaml>=6",
  "scikit-learn>=1.5",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "pyright>=1.1.380"]

[tool.pytest.ini_options]
pythonpath = ["..", "."]
asyncio_mode = "auto"
markers = ["live: hits the network", "db: needs postgres"]
addopts = "-m 'not live and not db'"

[tool.ruff]
line-length = 100

[tool.pyright]
typeCheckingMode = "standard"
