services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: solarbud}
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10}
  api:
    build: ./backend
    command: uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000
    env_file: .env
    ports: ["8000:8000"]
    depends_on: {postgres: {condition: service_healthy}}
  worker:
    build: ./backend
    command: python -m app.workers.scheduler
    env_file: .env
    depends_on: {postgres: {condition: service_healthy}}
